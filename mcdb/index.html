    <script>
      // Restore path from 404.html SPA redirect
      (function(l){
        if(l.search[1]==='/'){
          var parts=l.search.slice(1).split('&').map(function(s){return s.replace(/~and~/g,'&')});
          window.history.replaceState(null,null,
            l.pathname.replace(/\/$/,'')+parts[0]+(parts[1]?'?'+parts[1]:'')+l.hash);
        }
      }(window.location));
    </script>
